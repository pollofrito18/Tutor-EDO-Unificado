services:
  base:
    image: postgres:17
    environment:
      POSTGRES_DB: tutor_edo
      POSTGRES_USER: tutor_edo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD antes de iniciar}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tutor_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor_edo -d tutor_edo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  tutor_postgres:
